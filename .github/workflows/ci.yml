name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Tests
        run: npm test

      # Sin variables de entorno a propósito: el build no debe necesitar
      # credenciales. Si alguien vuelve a exigirlas en tiempo de build, aquí
      # falla antes de llegar a Railway.
      - name: Build
        run: npm run build
